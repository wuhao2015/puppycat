[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "puppycat-api"
version = "0.1.0"
description = "Puppycat Travel API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
