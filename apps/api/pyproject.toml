[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "puppycat-api"
version = "0.1.0"
description = "Puppycat Travel API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.19,<2",
  "asyncpg>=0.30,<1",
  "bcrypt>=4.2,<5",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
