services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: puppycat_test
      POSTGRES_PASSWORD: puppycat_test
      POSTGRES_DB: puppycat_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puppycat_test -d puppycat_test"]
      interval: 2s
      timeout: 5s
      retries: 15
